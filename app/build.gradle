plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ahmed.volumesolver'
    compileSdk 35

    defaultConfig {
        applicationId 'com.ahmed.volumesolver'
        minSdk 30
        targetSdk 34
        versionCode 4
        versionName '1.3'
    }

    signingConfigs {
        debug {
            // A fixed debug key (the file sits next to this one) so every new build installs over the
            // previous one and keeps the saved settings and the accessibility permission. If the file is
            // missing, Gradle falls back to its own random debug key.
            if (file('debug.keystore').exists()) {
                storeFile file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
                storeType 'pkcs12'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
